name: ${PACKAGE_NAME}
arch: ${GOARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: utils
priority: optional
maintainer: "Air Gap"
description: |
  Air Gap upstream components - Kafka to UDP sender with encryption.
  Includes upstream (main sender) and resend (gap recovery) binaries.
  Built from commit ${GITHUB_SHA}.
homepage: "https://github.com/anders-wartoft/air-gap"
license: "LGPL-2.1-only"

contents:
  # Binaries
  - src: target/linux-amd64/upstream
    dst: /usr/local/bin/stream-upstream
    file_info:
      mode: 0755

  - src: target/linux-amd64/resend
    dst: /usr/local/bin/stream-resend
    file_info:
      mode: 0755

  # Systemd services
  - src: packaging/systemd/stream-upstream@.service
    dst: /lib/systemd/system/stream-upstream@.service
    file_info:
      mode: 0644

  - src: packaging/systemd/stream-resend@.service
    dst: /lib/systemd/system/stream-resend@.service
    file_info:
      mode: 0644

  # Configuration examples
  - src: config/upstream.properties
    dst: /etc/stream/upstream.properties.example
    type: config
    file_info:
      mode: 0644

  - src: config/resend.properties
    dst: /etc/stream/resend.properties.example
    type: config
    file_info:
      mode: 0644

  # Documentation
  - src: README.md
    dst: /usr/share/doc/stream-upstream/README.md
    file_info:
      mode: 0644

scripts:
  preinstall: packaging/scripts/stream-upstream-preinstall.sh
  postinstall: packaging/scripts/stream-upstream-postinstall.sh
  postremove: packaging/scripts/stream-upstream-postremove.sh

overrides:
  rpm:
    depends:
      - glibc
      - shadow-utils
      - systemd
  deb:
    depends:
      - libc6
      - adduser
      - systemd
  apk:
    depends:
      - libc6-compat
      - shadow
      - openrc
