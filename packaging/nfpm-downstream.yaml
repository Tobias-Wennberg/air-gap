name: ${PACKAGE_NAME}
arch: ${GOARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: utils
priority: optional
maintainer: "Air Gap"
description: |
  Air Gap downstream components - UDP receiver with decryption and Kafka writer.
  Includes downstream (main receiver) binaries.
  Built from commit ${GITHUB_SHA}.
homepage: "https://github.com/anders-wartoft/air-gap"
license: "LGPL-2.1-only"

contents:
  # Binaries
  - src: target/linux-amd64/downstream
    dst: /usr/local/bin/stream-downstream
    file_info:
      mode: 0755

  # Systemd services
  - src: packaging/systemd/stream-downstream@.service
    dst: /lib/systemd/system/stream-downstream@.service
    file_info:
      mode: 0644

  # Configuration examples
  - src: config/downstream.properties
    dst: /etc/stream/downstream.properties.example
    type: config
    file_info:
      mode: 0644


  - src: config/gap_detector.properties
    dst: /etc/stream/gap_detector.properties.example
    type: config
    file_info:
      mode: 0644

  # Documentation
  - src: README.md
    dst: /usr/share/doc/stream-downstream/README.md
    file_info:
      mode: 0644

scripts:
  preinstall: packaging/scripts/stream-downstream-preinstall.sh
  postinstall: packaging/scripts/stream-downstream-postinstall.sh
  postremove: packaging/scripts/stream-downstream-postremove.sh

overrides:
  rpm:
    depends:
      - glibc
      - shadow-utils
      - systemd
  deb:
    depends:
      - libc6
      - adduser
      - systemd
  apk:
    depends:
      - libc6-compat
      - shadow
      - openrc
