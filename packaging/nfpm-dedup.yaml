name: ${PACKAGE_NAME}
arch: noarch
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: utils
priority: optional
maintainer: "Air Gap"
description: |
  Air Gap deduplication service - Kafka Streams application for event deduplication
  and gap detection. Processes downstream Kafka topics to ensure exactly-once delivery.
  Built from commit ${GITHUB_SHA}.
homepage: "https://github.com/anders-wartoft/air-gap"
license: "LGPL-2.1-only"

contents:
  - src: java-streams/target/air-gap-deduplication-fat.jar
    dst: /opt/stream/dedup/air-gap-deduplication-fat.jar
    file_info:
      mode: 0644

  - src: target/linux-amd64/create
    dst: /usr/local/bin/stream-create
    file_info:
      mode: 0755

  # Systemd template service
  - src: packaging/systemd/stream-dedup@.service
    dst: /lib/systemd/system/stream-dedup@.service
    file_info:
      mode: 0644

  - src: packaging/systemd/stream-create.service
    dst: /lib/systemd/system/stream-create.service
    file_info:
      mode: 0644

  # Configuration templates
  - src: config/dedup-template.env
    dst: /etc/stream/dedup-template.env
    type: config
    file_info:
      mode: 0644

  - src: config/log4j2.xml
    dst: /etc/stream/log4j2.xml
    type: config|noreplace
    file_info:
      mode: 0644

  - src: config/create.properties
    dst: /etc/stream/create.properties.example
    type: config
    file_info:
      mode: 0644

  # Documentation
  - src: README.md
    dst: /usr/share/doc/stream-dedup/README.md
    file_info:
      mode: 0644

scripts:
  preinstall: packaging/scripts/stream-dedup-preinstall.sh
  postinstall: packaging/scripts/stream-dedup-postinstall.sh
  postremove: packaging/scripts/stream-dedup-postremove.sh

overrides:
  rpm:
    depends:
      - glibc
      - shadow-utils
      - systemd
      - java-11-openjdk-headless
  deb:
    depends:
      - libc6
      - adduser
      - systemd
      - openjdk-11-jre-headless
  apk:
    depends:
      - libc6-compat
      - shadow
      - openrc
      - openjdk11-jre-headless
